- name: NodeJS
  hosts: all
  gather_facts: true
  vars_files:
    - ../vars/main.yml

  tasks:
  # -------------------------------------------------------------------------- #
  #               ------- NVM ------
  # -------------------------------------------------------------------------- #

  # Installation
  # curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | bash
  - name: nvm - Installation
    tags: init
    ansible.builtin.import_tasks:
      file: ../tasks/script.yml
    vars:
      url: "{{ nvm_install_url }}"
      cmd: /tmp/install.sh

  # -------------------------------------------------------------------------- #
  #               ------- NodeJS ------
  # -------------------------------------------------------------------------- #

  # Dependencies
  - name: Dependencies
    ansible.builtin.import_tasks:
      file: ../tasks/packages.yml
    vars:
      package_list: "{{ node_dependencies }}"
      package_type: dependencies

  # Repository
  - name: Repository
    tags: init
    ansible.builtin.import_tasks:
      file: ../tasks/repository.yml
    vars:
      key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      key_output: /etc/apt/keyrings/nodesource.gpg
      repository: "deb [arch={{ deb_architecture[ansible_architecture] }} signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"

  # Packages
  - name: Packages
    ansible.builtin.import_tasks:
      file: ../tasks/packages.yml
    vars:
      package_list: "{{ node_packages }}"

  # Version
  - name: Version
    tags: [init, update]
    ansible.builtin.import_tasks:
      file: ../tasks/version.yml
    vars:
      cmd: node --version

  # -------------------------------------------------------------------------- #
  #               ------- NPM ------
  # -------------------------------------------------------------------------- #

  # NPM Packages
  - name: NPM Packages
    ansible.builtin.import_tasks:
      file: ../tasks/npm_packages.yml
    vars:
      package_list: "{{ npm_packages }}"
